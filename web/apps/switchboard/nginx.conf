server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Path-only Location headers, so redirects keep a non-standard port.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin" always;

    # The app lives under /switchboard (Vite base '/switchboard/').
    location /switchboard/ {
        try_files $uri $uri/ /switchboard/index.html;
        # Never cache the entry: it names the current hashed bundles.
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin" always;
    }

    location = /switchboard {
        return 302 /switchboard/$is_args$args;
    }

    # Content-hashed bundles only.
    location ^~ /switchboard/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    location / {
        return 302 /switchboard$request_uri;
    }
}
