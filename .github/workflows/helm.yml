name: Helm Chart Checks

# Phase-0 gate from the footprint plan: every chart change must lint and
# render. Templates both profiles so a values regression in either the
# default or the compact (clickhouse-less) shape fails CI.
on:
  push:
    branches: [main, dev]
    paths: ['charts/**']
  pull_request:
    paths: ['charts/**']

jobs:
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: helm lint
        run: |
          helm lint charts/sinas \
            --set domain=ci.example.com \
            --set secrets.secretKey=ci --set secrets.encryptionKey=ci \
            --set postgres.password=ci --set clickhouse.password=ci

      - name: helm template (default profile)
        run: |
          helm template ci charts/sinas \
            --set domain=ci.example.com \
            --set secrets.secretKey=ci --set secrets.encryptionKey=ci \
            --set postgres.password=ci --set clickhouse.password=ci \
            > /tmp/default.yaml
          grep -q "kind: StatefulSet" /tmp/default.yaml
          # Client IP from the ingress's X-Forwarded-For, trusted proxies only
          grep -q -- "--proxy-headers" /tmp/default.yaml
          grep -A1 "name: FORWARDED_ALLOW_IPS" /tmp/default.yaml | grep -q '10.0.0.0/8'
          grep -q "name: clickhouse" /tmp/default.yaml

      - name: helm template (compact profile, clickhouse disabled)
        run: |
          helm template ci charts/sinas \
            --set domain=ci.example.com \
            --set secrets.secretKey=ci --set secrets.encryptionKey=ci \
            --set postgres.password=ci \
            --set clickhouse.enabled=false \
            > /tmp/compact.yaml
          ! grep -q "name: clickhouse" /tmp/compact.yaml
          # backend must get the explicit-disable signal
          grep -q 'CLICKHOUSE_HOST' /tmp/compact.yaml

      - name: helm template (OpenTelemetry, exporter headers from a Secret)
        run: |
          helm template ci charts/sinas \
            --set domain=ci.example.com \
            --set secrets.secretKey=ci --set secrets.encryptionKey=ci \
            --set postgres.password=ci --set clickhouse.password=ci \
            --set otel.enabled=true \
            --set 'otel.exporters[0].name=lang-fuse' \
            --set 'otel.exporters[0].endpoint=https://otel.example.com' \
            --set 'otel.exporters[0].headersSecret.name=otel-creds' \
            --set 'otel.exporters[1].name=off' \
            --set 'otel.exporters[1].endpoint=https://off.example.com' \
            --set 'otel.exporters[1].enabled=false' \
            --set 'otel.exporters[1].headersSecret.name=gone' \
            > /tmp/otel.yaml
          grep -q 'name: OTEL_EXPORTERS' /tmp/otel.yaml
          grep -q 'name: OTEL_EXPORTER_LANG_FUSE_HEADERS' /tmp/otel.yaml
          # a disabled exporter references no Secret (it may be gone)
          ! grep -q 'OTEL_EXPORTER_OFF_HEADERS' /tmp/otel.yaml
          # the Secret reference never lands in the exporter JSON
          ! grep -q 'headersSecret' /tmp/otel.yaml
          # and nothing OTel is rendered while it is off
          ! grep -q 'OTEL_' /tmp/compact.yaml

      - name: helm template (CDC disabled)
        run: |
          helm template ci charts/sinas \
            --set domain=ci.example.com \
            --set secrets.secretKey=ci --set secrets.encryptionKey=ci \
            --set postgres.password=ci --set clickhouse.password=ci \
            --set features.cdc=false \
            > /tmp/no-cdc.yaml
          # `! grep` doesn't fail a bash -e step unless it is the last command
          if grep -q "name: cdc-worker" /tmp/no-cdc.yaml; then
            echo "cdc-worker rendered with features.cdc=false" >&2
            exit 1
          fi
          # the backend must know, so the API refuses instead of going inert
          grep -A1 'name: CDC_ENABLED' /tmp/no-cdc.yaml | grep -q '"false"'
