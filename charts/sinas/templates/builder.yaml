apiVersion: apps/v1
kind: Deployment
metadata:
  name: builder
  labels:
    {{- include "sinas.labels" . | nindent 4 }}
    app.kubernetes.io/component: builder
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: builder
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: builder
    spec:
      {{- include "sinas.imagePullSecrets" . | nindent 6 }}
      {{- with (include "sinas.scheduling" (dict "values" (.Values.builder) "root" . "inherit" true) | trim) }}{{ . | nindent 6 }}{{- end }}
      containers:
        - name: builder
          image: {{ .Values.image.registry }}/builder:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 3000
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.builder.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: builder
  labels:
    {{- include "sinas.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: builder
  ports:
    - port: 3000
      targetPort: 3000
