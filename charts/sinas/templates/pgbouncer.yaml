apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
  labels:
    {{- include "sinas.labels" . | nindent 4 }}
    app.kubernetes.io/component: pgbouncer
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: pgbouncer
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: pgbouncer
    spec:
      containers:
        - name: pgbouncer
          image: edoburu/pgbouncer:latest
          {{- with (.Values.pgbouncer).resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  {{- include "sinas.dbPasswordRef" . | nindent 18 }}
            - name: DATABASE_URL
              value: "postgres://{{ .Values.postgres.user }}:$(DATABASE_PASSWORD)@{{ ((.Values.postgres).external).host | default "postgres" }}:5432/{{ .Values.postgres.database }}"
            - name: POOL_MODE
              value: {{ .Values.pgbouncer.poolMode | quote }}
            - name: MAX_CLIENT_CONN
              value: {{ .Values.pgbouncer.maxClientConn | quote }}
            - name: DEFAULT_POOL_SIZE
              value: {{ .Values.pgbouncer.defaultPoolSize | quote }}
            - name: MIN_POOL_SIZE
              value: {{ .Values.pgbouncer.minPoolSize | quote }}
            - name: RESERVE_POOL_SIZE
              value: {{ .Values.pgbouncer.reservePoolSize | quote }}
            - name: AUTH_TYPE
              value: scram-sha-256
          ports:
            - containerPort: 5432
          livenessProbe:
            exec:
              command: ["pg_isready", "-h", "localhost", "-p", "5432"]
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["pg_isready", "-h", "localhost", "-p", "5432"]
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: pgbouncer
  labels:
    {{- include "sinas.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: pgbouncer
  ports:
    - port: 5432
      targetPort: 5432
