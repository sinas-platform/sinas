apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
  labels:
    {{- include "sinas.labels" . | nindent 4 }}
    app.kubernetes.io/component: pgbouncer
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: pgbouncer
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: pgbouncer
    spec:
      automountServiceAccountToken: false
      {{- with (include "sinas.scheduling" (dict "values" (.Values.pgbouncer) "root" . "inherit" true) | trim) }}{{ . | nindent 6 }}{{- end }}
      {{- with (include "sinas.imagePullSecrets" . | trim) }}{{ . | nindent 6 }}{{- end }}
      {{- with (include "sinas.podSecurityContextBlock" (dict "root" . "values" (.Values.pgbouncer) "imageUser" (dict "runAsUser" 70 "runAsGroup" 70 "fsGroup" 70)) | trim) }}{{ . | nindent 6 }}{{- end }}
      containers:
        - name: pgbouncer
          image: {{ include "sinas.image.pgbouncer" . }}
          {{- with (include "sinas.containerSecurityContextBlock" (dict "root" . "values" (.Values.pgbouncer)) | trim) }}{{ . | nindent 10 }}{{- end }}
          {{- with (.Values.pgbouncer).resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  {{- include "sinas.dbPasswordRef" . | nindent 18 }}
            - name: DATABASE_URL
              value: "postgres://{{ .Values.postgres.user }}:$(DATABASE_PASSWORD)@{{ ((.Values.postgres).external).host | default "postgres" }}:5432/{{ .Values.postgres.database }}"
            - name: POOL_MODE
              value: {{ .Values.pgbouncer.poolMode | quote }}
            - name: MAX_CLIENT_CONN
              value: {{ .Values.pgbouncer.maxClientConn | quote }}
            - name: DEFAULT_POOL_SIZE
              value: {{ .Values.pgbouncer.defaultPoolSize | quote }}
            - name: MIN_POOL_SIZE
              value: {{ .Values.pgbouncer.minPoolSize | quote }}
            - name: RESERVE_POOL_SIZE
              value: {{ .Values.pgbouncer.reservePoolSize | quote }}
            - name: AUTH_TYPE
              value: scram-sha-256
            {{- /* TLS to an external database (postgres.external.tls): the
                   image's entrypoint writes these into pgbouncer.ini as
                   server_tls_sslmode / server_tls_ca_file. Unset = pgbouncer's
                   default ("prefer"). */}}
            {{- with (include "sinas.postgresTlsMode" .) }}
            - name: SERVER_TLS_SSLMODE
              value: {{ . | quote }}
            {{- end }}
            {{- if include "sinas.postgresCaEnabled" . }}
            - name: SERVER_TLS_CA_FILE
              value: {{ include "sinas.postgresCaPath" . | quote }}
            {{- end }}
          {{- with (include "sinas.postgresCaMount" . | trim) }}
          volumeMounts:
            {{- . | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: 5432
          ## Timings: pgbouncer.probes.
          {{- include "sinas.componentProbes" (dict "root" . "values" .Values.pgbouncer "defaults" "sinas.probes.pgbouncer.default" "handler" (dict "exec" (dict "command" (list "pg_isready" "-h" "localhost" "-p" "5432")))) | nindent 10 }}
      {{- with (include "sinas.postgresCaVolume" . | trim) }}
      volumes:
        {{- . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: pgbouncer
  labels:
    {{- include "sinas.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: pgbouncer
  ports:
    - port: 5432
      targetPort: 5432
