## Executor RBAC — what replaces the Docker socket / DinD.
##
## executor-manager SA: used by backend, queue workers, and scheduler. May
## create/inspect/delete sandbox pods and exec into them, in this namespace
## only. This is the entire privilege surface needed to run untrusted code.
##
## sandbox SA: assigned to the sandbox pods themselves. No permissions, and
## no API token is mounted (the executor also sets
## automountServiceAccountToken: false on each pod). It exists so sandbox
## pods never run as the namespace default SA and so private-registry pull
## secrets can be attached to them.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sinas.executorManagerSA" . }}
  labels:
    {{- include "sinas.labels" . | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sinas.sandboxSA" . }}
  labels:
    {{- include "sinas.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- /* The backend's runtime pods (sandbox + warm trusted workers) run as
       this SA and inherit its pull secrets: the same list every chart pod
       gets (registry.* plus imagePullSecrets). */}}
{{- include "sinas.imagePullSecrets" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-executor-manager
  labels:
    {{- include "sinas.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-executor-manager
  labels:
    {{- include "sinas.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-executor-manager
subjects:
  - kind: ServiceAccount
    name: {{ include "sinas.executorManagerSA" . }}
    namespace: {{ .Release.Namespace }}
{{- /* On unless explicitly false; a --reuse-values upgrade from a release
       without the key keeps it on. */}}
{{- $systemStats := .Values.systemStats | default dict }}
{{- if or (not (hasKey $systemStats "rbac")) $systemStats.rbac }}
---
## System page stats — read-only. The console's System page lists the
## release's pods (phase, ready, restarts, age) and, where metrics-server is
## installed, their CPU/memory from metrics.k8s.io. Bound to the backend's
## SA. Without metrics-server the metrics rule is simply unused.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-system-stats
  labels:
    {{- include "sinas.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-system-stats
  labels:
    {{- include "sinas.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-system-stats
subjects:
  - kind: ServiceAccount
    name: {{ include "sinas.executorManagerSA" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
