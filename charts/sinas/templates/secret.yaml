apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels:
    {{- include "sinas.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- /* With secrets.existingSecret the app keys come from that Secret and
         are never rendered here (nor kept in the release record). */}}
  {{- if not (.Values.secrets | default dict).existingSecret }}
  secret-key: {{ required "secrets.secretKey is required — set it via --set secrets.secretKey=... or a values file (or point secrets.existingSecret at a pre-created Secret)" .Values.secrets.secretKey | quote }}
  encryption-key: {{ required "secrets.encryptionKey is required — set it via --set secrets.encryptionKey=... or a values file (or point secrets.existingSecret at a pre-created Secret)" .Values.secrets.encryptionKey | quote }}
  {{- end }}
  {{- if .Values.superadminPassword }}
  superadmin-password: {{ .Values.superadminPassword | quote }}
  {{- end }}
  {{- if not ((.Values.postgres).external).existingSecret }}
  database-password: {{ required "postgres.password is required — set it via --set postgres.password=... or a values file (or point postgres.external.existingSecret at a pre-created Secret)" .Values.postgres.password | quote }}
  {{- end }}
  {{- if .Values.clickhouse.enabled }}
  clickhouse-password: {{ .Values.clickhouse.password | quote }}
  {{- end }}
  smtp-password: {{ .Values.smtp.password | quote }}
{{- if and .Values.registry .Values.registry.username }}
---
## Image pull secret for sinas images and sandbox pods (attached to the
## sandbox ServiceAccount so the executor-created pods inherit it).
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-pull-secret
  labels:
    {{- include "sinas.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {
      "auths": {
        {{ .Values.registry.server | quote }}: {
          "auth": {{ printf "%s:%s" .Values.registry.username .Values.registry.password | b64enc | quote }}
        }
      }
    }
{{- end }}
