## Image — the sinas backend image (also used by workers, scheduler, cdc).
image:
  registry: ghcr.io/sinas-platform/sinas
  tag: latest
  pullPolicy: IfNotPresent

## Routing
domain: ""

## Ingress — standard networking.k8s.io/v1. For Gateway API (HTTPRoute) or
## provider-specific routing, disable this and bring your own route objects.
ingress:
  enabled: true
  className: ""
  annotations: {}
  tls:
    enabled: false
    secretName: ""  # existing TLS secret; leave empty when using cert-manager annotations

## Secrets (required — provide via --set or a secrets values file)
secrets:
  secretKey: ""
  encryptionKey: ""

## Superadmin
superadminEmail: ""

## Executor — how sinas runs user/agent code.
##
## sandbox: untrusted code (untrusted Functions + agent codeExecution).
##   "k8s_pod"  — one ephemeral hardened Pod per execution (default).
##   "disabled" — reject sandbox executions (trusted-only deployment).
## trusted: admin-approved code (Function.shared_pool=true).
##   "k8s_shared" — warm long-lived credential-free pods (default). Trusted
##                  code cannot reach platform credentials or the usage
##                  meter; paired with the trusted-isolation NetworkPolicy.
##   "inprocess"  — runs inside the queue-worker process. Smallest footprint
##                  (no warm pods), but trusted code shares the worker's
##                  credentials — do not use on metered/billable instances.
##   "disabled"   — reject shared_pool executions with a clear error.
executor:
  sandbox: "k8s_pod"
  trusted: "k8s_shared"
  ## Number of warm trusted worker pods (k8s_shared only).
  trustedWorkers: 2
  ## Image for sandbox pods. Must be pullable by the cluster. Extra packages
  ## (Dependency table) are pip-installed into each pod at create time; bake
  ## them into a custom image and set installDependencies: false to skip that
  ## cold-start cost.
  image: "ghcr.io/sinas-platform/sinas/executor:latest"
  installDependencies: true
  podReadyTimeout: 120

## Pull secret for private registries (applies to sinas images AND sandbox
## pods, via their ServiceAccounts). Leave username empty for public images.
registry:
  server: "ghcr.io"
  username: ""
  password: ""

## PostgreSQL
postgres:
  user: postgres
  database: sinas
  password: ""
  storage: 5Gi

## Redis
redis:
  maxmemory: "256mb"
  storage: 1Gi

## ClickHouse
clickhouse:
  ## Set false for the compact profile: no ClickHouse pod, request/execution
  ## logging off, log UI empty. Everything else works normally.
  enabled: true
  user: default
  password: ""
  database: sinas
  storage: 5Gi
  memoryLimit: "1Gi"

## PGBouncer
pgbouncer:
  poolMode: transaction
  maxClientConn: 1000
  defaultPoolSize: 50
  minPoolSize: 10
  reservePoolSize: 10

## File storage — shared volume for uploaded files (/var/sinas/files).
## Mounted into backend, queue-worker, queue-agent, scheduler.
## Use an RWX storage class on multi-node clusters.
fileStorage:
  size: 5Gi
  storageClass: ""

## Network policy — namespace isolation + locked-down sandbox pods.
## ingressNamespace: the namespace your ingress controller runs in (allowed to
## reach backend/console). Leave empty to allow ingress from any namespace.
networkPolicy:
  enabled: true
  ingressNamespace: ""

## Builder (Node.js esbuild server)
builder:
  resources:
    requests:
      cpu: "50m"
      memory: "96Mi"
    limits:
      cpu: "500m"
      memory: "384Mi"

## Backend (FastAPI)
backend:
  replicas: 1
  resources:
    requests:
      cpu: "300m"
      memory: "384Mi"
    limits:
      cpu: "1500m"
      memory: "1536Mi"

## Queue worker
queueWorker:
  replicas: 1
  ## Max concurrent function executions per worker (QUEUE_FUNCTION_CONCURRENCY).
  ## Total burst envelope per release ≈ replicas × concurrency × per-execution
  ## memory, bounded by resources.limits.memory — size them together.
  concurrency: 10
  resources:
    requests:
      cpu: "150m"
      memory: "192Mi"
    limits:
      cpu: "1"
      memory: "768Mi"

## Queue agent worker
queueAgent:
  replicas: 1
  ## Max concurrent agent jobs per worker (QUEUE_AGENT_CONCURRENCY).
  concurrency: 5
  resources:
    requests:
      cpu: "150m"
      memory: "192Mi"
    limits:
      cpu: "1"
      memory: "768Mi"

## Scheduler
scheduler:
  resources:
    requests:
      cpu: "50m"
      memory: "96Mi"
    limits:
      cpu: "500m"
      memory: "384Mi"

## CDC worker
cdcWorker:
  resources:
    requests:
      cpu: "50m"
      memory: "96Mi"
    limits:
      cpu: "500m"
      memory: "384Mi"

## Console (React SPA)
console:
  resources:
    requests:
      cpu: "25m"
      memory: "32Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"

## SMTP
## smtp.ipv4: forces smtp.host to resolve to this IPv4 (avoids ENETUNREACH on IPv6-less pods).
smtp:
  host: ""
  port: 587
  user: ""
  password: ""
  domain: ""
  ipv4: ""

## Optional platform features. Both default on — turning one off removes the
## capability (endpoints reject explicitly rather than failing oddly).
features:
  ## false disables ALL user-code execution: Functions and the agent
  ## codeExecution tool. Also skips sandbox/shared-worker startup entirely, so
  ## no pool, no per-execution pods, and no executor image is needed — the
  ## biggest single footprint saving available.
  codeExecution: true
  ## false skips creating the `sinas_data` database and its default Database
  ## Connection on startup, for operators who only use their own connections.
  ## Does NOT affect the platform's own Postgres, and leaves an already-created
  ## record untouched.
  builtinDatabase: true

## Access-token signing (OIDC-compatible verification).
## algorithm "RS256" signs access tokens with an RSA keypair and publishes the
## public key at /.well-known/jwks.json so external services can verify Sinas
## tokens offline with standard JWT middleware. Default "" keeps HS256.
jwt:
  algorithm: ""
  ## Optional: bring your own RS256 private key via an existing Secret.
  ## When unset, Sinas auto-generates a keypair on first boot and stores it
  ## encrypted in the database (shared by all processes) — no key management
  ## needed.
  existingSecret: ""
  existingSecretKey: "jwt-private-key"
  ## iss / aud claims on RS256 tokens; issuer defaults to the instance URL.
  issuer: ""
  audience: ""

## Extra environment variables appended to every sinas service (backend,
## queue workers, scheduler, cdc-worker). Any backend Settings knob
## (app/core/config.py) can be set here without a chart change, e.g.:
##   - name: MAX_FUNCTION_MEMORY
##     value: "256"
##   - name: FUNCTION_TIMEOUT
##     value: "120"
extraEnv: []
