# Access log without query strings, and with the referer's query cut: a
# setup link (/ui/?token=...) must not land in the logs usable. (Assets the
# page loads before it strips the token would carry it in their Referer.)
map $http_referer $sinas_referer_noquery {
    "~^(?<sinas_ref_base>[^?]*)\?"  "${sinas_ref_base}?[redacted]";
    default                          $http_referer;
}
log_format sinas_noquery '$remote_addr - $remote_user [$time_local] '
                         '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                         '"$sinas_referer_noquery" "$http_user_agent"';

server {
    # Unprivileged port: the container runs as a non-root user. The
    # Kubernetes Service still exposes 80 (targetPort 8080).
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log sinas_noquery;

    # Emit path-only Location headers ("/ui/...") so redirects survive
    # non-standard ports (dev serves this container on :51245 directly;
    # nginx's default absolute redirect drops the port).
    absolute_redirect off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # The app lives under /ui (built with Vite base '/ui/', files at html/ui).
    # This is what lets the ingress route by path with no per-endpoint
    # allowlist: /ui -> console, everything else -> backend.
    location /ui/ {
        try_files $uri $uri/ /ui/index.html;
        # The SPA entry must never be cached: a heuristically-cached
        # index.html keeps referencing old hashed bundles after a deploy,
        # leaving tabs on stale code (with correspondingly stale API calls).
        add_header Cache-Control "no-cache" always;
    }

    # The bare prefix (a setup link is `<console>/ui?token=...`): into the
    # app with the query kept. `location /` below would send it to /ui/ui.
    location = /ui {
        return 302 /ui/$is_args$args;
    }

    # Immutable caching ONLY for Vite's content-hashed bundles. public/ files
    # (logos, favicon) keep stable names, so an immutable year here would pin
    # old branding in every returning browser — they get a short revalidating
    # cache instead.
    location ^~ /ui/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # Anything else reaching this container (the ingress Exact-/ rule, direct
    # port access in dev, pre-/ui bookmarks) — send to the app, preserving the
    # path so old console links like /agents land on their SPA route.
    location / {
        return 302 /ui$request_uri;
    }
}
