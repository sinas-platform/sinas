[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sinas"
dynamic = ["version"]
description = "Sinas - AI Agent Platform with LLM chat, webhooks, state management, files and function execution"
authors = [
    {name = "Kjeld Oostra"}
]
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
    "psycopg2-binary>=2.9.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "email-validator>=2.0.0",
    "apscheduler>=3.10.0",
    "httpx>=0.25.0",
    "python-multipart>=0.0.6",
    "croniter>=1.4.0",
    "asyncpg>=0.29.0",
    "jsonschema>=4.20.0",
    "jmespath>=1.0.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt (>=4.1.0)",
    "openai>=1.3.0",
    # Bounded to the major we code against: the image build installs from
    # this file (not the lock), and 1.0.0 removed the sampling kwargs
    # (temperature/top_p/top_k) — an unbounded range let images resolve a
    # breaking major ahead of the code (every agent invoke 500'd).
    "anthropic>=1.0.0,<2",
    "sse-starlette>=1.8.0",
    "websockets>=12.0",
    "cryptography (>=46.0.3,<47.0.0)",
    "clickhouse-connect>=0.7.0",
    "Jinja2>=3.1.0",
    "aiosmtpd>=1.4.0",
    "docker>=7.0.0",
    "kubernetes>=29.0.0",
    "redis[hiredis]>=5.0.0",
    "arq>=0.25.0",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp-proto-http>=1.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "W", "F", "I", "N", "B", "A", "C4", "UP"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.dynamic]
# Single source of truth: app/_version.py. Bump there only.
version = {attr = "app._version.__version__"}